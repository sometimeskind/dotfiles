# tmux config — install: brew install tmux

# True colour support
set -g default-terminal tmux-256color
set -ga terminal-overrides ,*:Tc

# Prefix
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Quality of life
set -g mouse on
set -g exit-empty off
set -g escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
set -g aggressive-resize on
set -g mode-keys vi
set -g status-keys vi
bind x kill-pane
bind | split-window -h
bind-key -- - split-window -v
unbind '"'
unbind %

# Status bar — Argonaut palette, minimal
set -g status-style bg=#1a1a1a,fg=#fffaf4
set -g window-status-current-style fg=#008df8,bold
set -g status-left "[#S] "
set -g status-right ""
set -g status-left-length 30

# Resurrect
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux

# Session picker
bind-key T display-popup -E 'sesh connect "$(sesh list --icons | fzf --ansi --bind "ctrl-d:execute(tmux kill-session -t {2..})+reload(sesh list --icons)")"'
